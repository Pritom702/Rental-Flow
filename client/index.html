<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RentalFlow — Rent anything</title>
    <meta name="theme-color" content="#F5F1E8" />
    <script>
      // Apply the saved (or system) theme before the first paint — no flash.
      (function () {
        try {
          var t = localStorage.getItem('rentalflow_theme');
          if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
          if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0C1511');
        } catch (e) { document.documentElement.dataset.theme = 'light'; }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
