# Spins up PostgreSQL for RentalFlow so every teammate has the same database
# with one command: `docker compose up -d`
services:
  db:
    image: postgres:16-alpine
    container_name: rentalflow-db
    environment:
      POSTGRES_USER: rentalflow
      POSTGRES_PASSWORD: rentalflow_dev
      POSTGRES_DB: rentalflow
    ports:
      - "5433:5432"   # host 5433 -> container 5432 (avoids clashing with a local Postgres)
    volumes:
      - rentalflow_pgdata:/var/lib/postgresql/data

volumes:
  rentalflow_pgdata:
